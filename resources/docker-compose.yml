services:
  redis:
    image: redis:8.6-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  absp:
    image: ghcr.io/variton/iabsp:1.0
    container_name: absp
    working_dir: /home/absp
    volumes:
      - .:/home/absp
    environment:
      - REDIS_URL=redis://redis:6379
    network_mode: "service:redis"
    depends_on:
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true



