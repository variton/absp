[project]
name = "absp"
version = "0.1.0"
description = "Asynchronous Backend Store Package"
requires-python = ">=3.14"

# dépendances runtime du package
dependencies = [
    "async-class",
]

[dependency-groups]
dev = [
    "black",
    "pycodestyle",
    "pydocstyle",
    "pytest",
    "pytest-asyncio",
    "pytest-html",
    "ruff",
    "bandit",
    "sphinx",
    "furo",
    "coverage",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
