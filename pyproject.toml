[project]
name = "absp"
version = "0.1.0"
description = "Asynchronous Backend Store Package"
requires-python = ">=3.14"

# runtime dependencies of absp package
dependencies = [
    "async-class",
    "redis",
    "xphide",
]

[tool.uv.sources]
xphide = { git = "https://github.com/variton/xphide.git", tag = "v0.1.1" }

[dependency-groups]
dev = [
    "black",
    "pycodestyle",
    "pydocstyle",
    "pytest",
    "pytest-asyncio",
    "pytest-html",
    "ruff",
    "bandit",
    "sphinx",
    "furo",
    "coverage",
    "ipdb",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
